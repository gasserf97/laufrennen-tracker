<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b3d2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex" />
    <title>Tennis Anzeige</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=IBM+Plex+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="display-body">
    <div class="display-app">
      <header class="display-top">
        <div>
          <p class="brand">Sport Tracker · Tennis</p>
          <p class="subtitle" id="displaySubtitle">Anzeige</p>
        </div>
        <div class="display-meta">
          <span id="displayClock" class="display-clock"></span>
          <span id="displayRotateHint" class="display-rotate-hint"></span>
        </div>
      </header>

      <main>
        <p class="error" id="displayError" hidden></p>
        <div id="displayScreen" class="display-screen"></div>
      </main>

      <footer class="site-footer">
        <p>Powered by Fabian Gasser</p>
      </footer>
    </div>

    <script src="/tennis-display.js"></script>
  </body>
</html>
