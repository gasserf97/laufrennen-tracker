<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b3d2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex" />
    <title>Rennergebnisse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=IBM+Plex+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <p class="brand"><a class="brand-link" href="/">Sport Tracker</a> · Ergebnisse</p>
          <p class="subtitle" id="subtitle">Wird geladen…</p>
        </div>
      </header>

      <main>
        <section class="view">
          <div class="panel">
            <h1 id="raceTitle">Ergebnis</h1>
            <p class="hint" id="summary"></p>
            <p class="error" id="loadError" hidden></p>

            <div id="pendingBox" class="pending-box" hidden>
              <p>Das Rennen ist noch nicht beendet. Ergebnisse erscheinen danach hier.</p>
            </div>

            <div id="resultsBox" hidden>
              <div class="tabs" role="tablist" aria-label="Ranglisten">
                <button
                  type="button"
                  class="tab is-active"
                  data-ranking="category"
                  role="tab"
                  aria-selected="true"
                >
                  Kategorie
                </button>
                <button
                  type="button"
                  class="tab"
                  data-ranking="overall"
                  role="tab"
                  aria-selected="false"
                >
                  Gesamt
                </button>
                <button
                  type="button"
                  class="tab"
                  data-ranking="gender"
                  role="tab"
                  aria-selected="false"
                >
                  Geschlecht
                </button>
              </div>
              <div id="rankingContent" class="ranking-content"></div>
              <button type="button" class="btn btn-primary" id="btnExport">
                Excel exportieren
              </button>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>Powered by Fabian Gasser</p>
      </footer>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="/ranking.js"></script>
    <script src="/results.js"></script>
  </body>
</html>
